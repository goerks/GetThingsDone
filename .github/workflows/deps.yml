name: Update dependencies

# Cloud sessions of the AI cannot reach the npm registry (#67). A push that changes
# `.github/deps-request.txt` installs the listed packages here and commits package.json
# and package-lock.json back to the branch.
on:
  push:
    paths: ['.github/deps-request.txt']

permissions:
  contents: write

jobs:
  deps:
    name: Install requested packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm install
          xargs -a .github/deps-request.txt npm install --save-dev
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: install packages for the design system" || echo "nothing to commit"
          git push
